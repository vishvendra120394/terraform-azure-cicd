name: Terraform Apply

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-pre-prod
  cancel-in-progress: false

jobs:

  # ==========================================
  # JOB 1: Terraform Plan
  # ==========================================
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: env/pre_prod_env

    steps:

      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Azure Login using OIDC
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # 3. Verify Azure authentication
      - name: Verify Azure Login
        run: az account show

      # 4. Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # 5. Terraform Init
      - name: Terraform Init
        run: terraform init -input=false

      # 6. Create Terraform variables file
      - name: Create Terraform variables file
        shell: bash
        env:
          TERRAFORM_TFVARS: ${{ secrets.TERRAFORM_TFVARS }}
        run: |
          printf '%s\n' "$TERRAFORM_TFVARS" > terraform.tfvars

      # 7. Terraform Validate
      - name: Terraform Validate
        run: terraform validate

      # 8. Terraform Plan
      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan

      # 9. Upload Terraform Plan
      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: env/pre_prod_env/tfplan
          retention-days: 1


  # ==========================================
  # JOB 2: Terraform Apply
  # ==========================================
  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest

    needs: terraform-plan

    environment: pre-prod

    defaults:
      run:
        working-directory: env/pre_prod_env

    steps:

      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Azure Login using OIDC
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # 3. Verify Azure authentication
      - name: Verify Azure Login
        run: az account show

      # 4. Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # 5. Terraform Init
      - name: Terraform Init
        run: terraform init -input=false

      # 6. Create Terraform variables file
      - name: Create Terraform variables file
        shell: bash
        env:
          TERRAFORM_TFVARS: ${{ secrets.TERRAFORM_TFVARS }}
        run: |
          printf '%s\n' "$TERRAFORM_TFVARS" > terraform.tfvars

      # 7. Download approved Terraform Plan
      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: env/pre_prod_env

      # 8. Terraform Apply
      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve tfplan