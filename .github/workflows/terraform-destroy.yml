name: Terraform Destroy

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-pre-prod-destroy
  cancel-in-progress: false

jobs:

  # ==========================================
  # JOB 1: Terraform Destroy Plan
  # ==========================================
  terraform-destroy-plan:
    name: Terraform Destroy Plan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: env/pre_prod_env

    steps:

      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Azure Login using OIDC
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # 3. Verify Azure authentication
      - name: Verify Azure Login
        run: az account show

      # 4. Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # 5. Terraform Init
      - name: Terraform Init
        run: terraform init -input=false

      # 6. Create Terraform variables file
      - name: Create Terraform variables file
        shell: bash
        env:
          TERRAFORM_TFVARS: ${{ secrets.TERRAFORM_TFVARS }}
        run: |
          printf '%s\n' "$TERRAFORM_TFVARS" > terraform.tfvars

      # 7. Terraform Destroy Plan
      - name: Terraform Destroy Plan
        run: terraform plan -destroy -input=false -out=destroy.tfplan

      # 8. Generate readable Destroy Plan
      - name: Generate readable Destroy Plan
        run: terraform show -no-color destroy.tfplan > destroy-plan.txt

      # 9. Upload Destroy Plan
      - name: Upload Destroy Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-destroy-plan
          path: |
            env/pre_prod_env/destroy.tfplan
            env/pre_prod_env/destroy-plan.txt
          retention-days: 1


  # ==========================================
  # JOB 2: Terraform Destroy
  # ==========================================
  terraform-destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest

    needs: terraform-destroy-plan

    environment: pre-prod

    defaults:
      run:
        working-directory: env/pre_prod_env

    steps:

      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Azure Login using OIDC
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # 3. Verify Azure authentication
      - name: Verify Azure Login
        run: az account show

      # 4. Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # 5. Terraform Init
      - name: Terraform Init
        run: terraform init -input=false

      # 6. Create Terraform variables file
      - name: Create Terraform variables file
        shell: bash
        env:
          TERRAFORM_TFVARS: ${{ secrets.TERRAFORM_TFVARS }}
        run: |
          printf '%s\n' "$TERRAFORM_TFVARS" > terraform.tfvars

      # 7. Download approved Destroy Plan
      - name: Download Terraform Destroy Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-destroy-plan
          path: env/pre_prod_env

      # 8. Terraform Destroy
      - name: Terraform Destroy
        run: terraform apply -input=false -auto-approve destroy.tfplan